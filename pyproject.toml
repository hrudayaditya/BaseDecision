[build-system]
requires = ["setuptools>=77"]  # 77 adds SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "basedecision"
version = "0.1.0rc5"
description = "Native typed decisions with complete-input packing and bounded batching"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Hrudayaditya Jallu"}]
keywords = ["classification", "decision-model", "modernbert", "nlp", "structured-output"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hrudayaditya/BaseDecision"
Documentation = "https://github.com/hrudayaditya/BaseDecision/blob/main/docs/API.md"
Source = "https://github.com/hrudayaditya/BaseDecision"
Issues = "https://github.com/hrudayaditya/BaseDecision/issues"
Changelog = "https://github.com/hrudayaditya/BaseDecision/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=2.54,<3"]
anthropic = ["anthropic>=0.125,<1"]
hub = ["huggingface-hub>=0.34,<2"]
providers = ["openai>=2.54,<3", "anthropic>=0.125,<1"]
runtime = ["torch>=2.6,<3", "transformers>=4.48,<5", "safetensors>=0.4", "tokenizers>=0.21"]

# Run `mypy` from the repository root. Torch, Transformers and the provider SDKs are optional
# dependencies, so the check must also pass where they are not installed.
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/basedecision"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "safetensors", "safetensors.*", "huggingface_hub", "huggingface_hub.*", "openai", "openai.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "basedecision._model"
disallow_subclassing_any = false  # nn.Module is Any when Torch is not installed

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basedecision = ["py.typed", "data/*.json"]
